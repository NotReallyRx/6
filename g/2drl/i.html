
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Viewer</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light dark;
      --bg: light-dark(#f7f7f5, #101010);
      --fg: light-dark(#171717, #f1f1ee);
      --line: light-dark(#c9c9c3, #41413e);
      --hover: light-dark(#e9e9e4, #222220);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    button {
      appearance: none;
      font: inherit;
      font-size: 12px;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--line);
      padding: 10px 14px;
      cursor: pointer;
    }

    button:hover, button:focus-visible {
      background: var(--hover);
      border-color: var(--fg);
      outline: none;
    }

    #game {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Game controls">
    <button id="back" type="button">← Back</button>
    <button id="refresh" type="button">↻ Refresh</button>
    <button id="direct" type="button">↗ Open index.svg</button>
  </nav>

  <iframe
    id="game"
    src="./index.svg"
    title="Game"
    allowfullscreen
  ></iframe>

  <script>
    const game = document.getElementById("game");

    document.getElementById("back").addEventListener("click", () => {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = "../../index.html";
      }
    });

    document.getElementById("refresh").addEventListener("click", () => {
      game.src = "./index.svg";
    });

    document.getElementById("direct").addEventListener("click", () => {
      location.href = "./index.svg";
    });
  </script>
</body>
</html>
